name: PDF 編輯器（macOS）

on:
  push:
    paths:
      - "PDFEditor/**"
      - ".github/workflows/pdf-editor-macos.yml"
  pull_request:
    paths:
      - "PDFEditor/**"
      - ".github/workflows/pdf-editor-macos.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: PDFEditor
    steps:
      - uses: actions/checkout@v4

      - name: 顯示工具版本
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: 編譯
        run: swift build

      - name: 單元測試
        run: swift test

      - name: 打包 App 與 DMG
        env:
          UNIVERSAL: "1"
        run: ./scripts/build-app.sh "1.0.${{ github.run_number }}"

      - name: 上傳 DMG
        uses: actions/upload-artifact@v4
        with:
          name: PDFEditor-macOS
          path: PDFEditor/build/PDFEditor.dmg
          if-no-files-found: error
