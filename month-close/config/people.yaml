# 人員名單（由財務長維護）
#
# 姓名：登入時選擇的名字，也是月結範本「負責人／覆核人」欄位要填的名字。
# 角色：主管 或 同仁。
#       主管可產生月份、維護範本、改派、代理操作、重新開啟、重設 PIN。
# 分工：顯示用，例如 AR、AP／費用。
# 初始PIN：4 位數字，務必加上引號（例如 "0123"），否則開頭的 0 會不見。
#          每個人第一次登入後會強制改成自己的 PIN，之後這裡的初始PIN就不再使用。
#          忘記 PIN 時請主管在「系統管理」頁重設。
#
# 以下為開發用的假資料，正式使用前請換成實際人員。

